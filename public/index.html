<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div id="auth-section">
      <h2>Login /Signup</h2>
      <input type="email" id="auth-email" placeholder="Email" required>
      <input type="password" id="auth-password" placeholder="Password" required>
      <button id="signup-btn">Signup</button>
      <button id="login-btn">Login</button>
      <p id="auth-message"></p>
    </div>
    <div id="app-section" style="Display:none;">
      <button id="logout-btn">Logout</button>
      
      <h1>My Expense Tracker</h1>
      <div class="balance-summary">
        <p>Balance: ₹<span id="balance">0</span></p>
        <p>Income: ₹<span id="total-income">0</span></p>
        <p>Expense: ₹<span id="total-expense">0</span></p>
      </div>
      <form id="transaction-form">
        <input type="text" id="title" placeholder="Enter title(eg. Lunch)" required>
        <input type="number" id="amount" placeholder="Enter amount" required>
        <select id="type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
        <select id="category">
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Bills">Bills</option>
          <option value="Shopping">Shopping</option>
          <option value="Salary">Salary</option>
          <option value="Other">Other</option>
        </select>
        <button type="submit">Add Transaction</button>  
      </form>
      <select id="filter-category">
        <option value="All">All Categories</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Bills">Bills</option>
        <option value="Shopping">Shopping</option>
        <option value="Salary">Salary</option>
        <option value="Other">Other</option>
      </select>
      <canvas id="expenseChart" width="400" height="400"></canvas>
      <div id="budget-status"></div>
      <form id="budget-form">
        <select id="budget-category">
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Bills">Bills</option>
          <option value="Shopping">Shopping</option>
          <option value="Salary">Salary</option>
          <option value="Other">Other</option>
        </select>
        <input type="number" id="budget-limit" placeholder="Enter budget limit" required>
        <button type="submit">Set Budget</button>
      </form>
      <h3>Transactions</h3>
      <ul id="transaction-list"></ul> 
    </div>
  </div>
  <script src="script.js"></script>

</body>
</html>
